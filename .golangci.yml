run:
  concurrency: 4
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  disable-all: true
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - typecheck
    - gosimple
    - unused
    - goimports
    - gocyclo
    - gocritic
    - revive

linters-settings:
  govet:
    check-shadowing: true
  gocyclo:
    min-complexity: 15
  goimports:
    local-prefixes: proxyRev

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
